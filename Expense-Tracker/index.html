<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Finance — Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Smart Financial Control Center</p>
        <h1>Nova Finance</h1>
        <p>Track expenses, monitor budgets, spot trends, and stay in control of every dollar.</p>
      </div>
      <div class="hero-actions">
        <button id="themeToggle" class="ghost-btn" type="button">🌙</button>
        <button id="exportBtn" class="primary-btn" type="button">Export CSV</button>
      </div>
    </header>

    <section class="stats-grid">
      <article class="stat-card">
        <h3>Income</h3>
        <div id="incomeValue" class="stat-value">$0</div>
      </article>
      <article class="stat-card">
        <h3>Expense</h3>
        <div id="expenseValue" class="stat-value">$0</div>
      </article>
      <article class="stat-card">
        <h3>Balance</h3>
        <div id="balanceValue" class="stat-value">$0</div>
      </article>
      <article class="stat-card">
        <h3>Budget Used</h3>
        <div id="budgetValue" class="stat-value">$0</div>
      </article>
    </section>

    <section class="dashboard-grid">
      <div class="panel">
        <h3 id="formTitle">Add new transaction</h3>
        <form id="transactionForm" class="form-grid">
          <label>
            Description
            <input id="description" placeholder="Coffee, salary, rent..." required />
          </label>
          <label>
            Amount
            <input id="amount" type="number" min="0" step="0.01" required />
          </label>
          <label>
            Type
            <select id="type">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </label>
          <label>
            Category
            <select id="category">
              <option>Food</option>
              <option>Travel</option>
              <option>Shopping</option>
              <option>Bills</option>
              <option>Wellness</option>
              <option>Salary</option>
              <option>Investments</option>
              <option>Other</option>
            </select>
          </label>
          <label>
            Date
            <input id="date" type="date" required />
          </label>
          <label>
            Payment Method
            <select id="paymentMethod">
              <option>Card</option>
              <option>Cash</option>
              <option>Bank Transfer</option>
              <option>UPI</option>
            </select>
          </label>
          <label class="full-width">
            <input id="recurring" type="checkbox" /> Mark as recurring
          </label>
          <div class="form-actions full-width">
            <button class="primary-btn" id="submitText" type="submit">Save transaction</button>
            <button class="secondary-btn" id="resetBtn" type="button">Reset</button>
          </div>
        </form>
      </div>

      <aside class="panel">
        <h3>Filters & Budget</h3>
        <div class="controls-stack">
          <label>
            Search
            <input id="search" placeholder="Search by name or category" />
          </label>
          <label>
            Month
            <select id="monthFilter"></select>
          </label>
          <label>
            Type
            <select id="typeFilter">
              <option value="all">All types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </label>
          <label>
            Category
            <select id="categoryFilter"></select>
          </label>
        </div>

        <div class="budget-card">
          <label>
            Monthly Budget
            <input id="budgetInput" type="number" min="0" step="100" />
          </label>
          <div class="progress-track">
            <div id="budgetBar" class="progress-bar"></div>
          </div>
          <p id="budgetText" style="margin: 8px 0 0; color: var(--muted);">0% remaining</p>
        </div>
      </aside>
    </section>

    <section class="analytics-grid">
      <div class="panel">
        <h3>Category Breakdown</h3>
        <div id="categoryBars"></div>
      </div>
      <div class="panel">
        <h3>Recent Activity</h3>
        <div id="transactionList"></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
